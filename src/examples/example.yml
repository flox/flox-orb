description: >
  Install Flox and run a command in a Flox environment.

usage:
  version: 2.1
  orbs:
    flox: flox/orb@1.0.0
  jobs:
    run-python-notebook:
      machine:
        image: ubuntu-2204:current
      steps:
        - flox/install:
            disable_metrics: "true"
        - flox/activate:
            environment: "flox/nb"
            command: "python --version"
