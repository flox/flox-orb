description: >
  Run a command in a Flox environment.

parameters:
  command:
    type: string
    default: ""
    description: >
      A command to run inside the Flox environment.
  environment:
    type: string
    default: ""
    description: >
      Remote environment to run the command in. If not specified it will try to
      find local Flox environment.
  dir:
    type: string
    default: ""
    description: >
      Path containing a .flox/ directory.

steps:
  - run:
      name: "Run command in a Flox environment"
      command: <<include(scripts/activate.sh)>>
      environment:
        PARAM_COMMAND: <<parameters.command>>
        PARAM_ENV: <<parameters.environment>>
        PARAM_DIR: <<parameters.dir>>
